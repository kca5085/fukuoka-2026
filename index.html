        // Initialize App
        function init() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    itineraryData = JSON.parse(saved);
                } else {
                    itineraryData = JSON.parse(JSON.stringify(DEFAULT_ITINERARY));
                }
            } catch (e) {
                console.error("Failed to load localStorage:", e);
                itineraryData = JSON.parse(JSON.stringify(DEFAULT_ITINERARY));
            }
            renderTabs();
            renderContent();
        }

        // Save to localStorage
        function saveData(showNotification = true) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(itineraryData));
                if (showNotification) {
                    showToast("✅ 已自動儲存變更");
                }
            } catch (e) {
                console.error("Save failed:", e);
                showToast("⚠️ 儲存失敗，請檢查瀏覽器設定");
            }
        }

        // Show Toast
        function showToast(msg) {
            const container = document.getElementById('toast-container');
            const textEl = document.getElementById('toast-msg');
            textEl.textContent = msg;
            container.classList.remove('opacity-0');
            container.classList.add('opacity-100');
            clearTimeout(window.toastTimer);
            window.toastTimer = setTimeout(() => {
                container.classList.remove('opacity-100');
                container.classList.add('opacity-0');
            }, 2200);
        }

        // Toggle Edit Mode
        function toggleEditMode() {
            isEditMode = !isEditMode;
            const btn = document.getElementById('btn-edit-mode');
            const text = document.getElementById('edit-text');
            const icon = document.getElementById('edit-icon');
            const banner = document.getElementById('edit-banner');

            if (isEditMode) {
                btn.classList.remove('bg-slate-800', 'text-slate-200', 'border-slate-700');
                btn.classList.add('bg-emerald-600', 'text-white', 'border-emerald-500');
                text.textContent = '完成編輯';
                icon.textContent = '✅';
                banner.classList.remove('hidden');
            } else {
                btn.classList.add('bg-slate-800', 'text-slate-200', 'border-slate-700');
                btn.classList.remove('bg-emerald-600', 'text-white', 'border-emerald-500');
                text.textContent = '編輯模式';
                icon.textContent = '✏️';
                banner.classList.add('hidden');
                saveData(true);
            }
            renderContent();
        }

                            ? 'bg-amber-500 text-slate-950 border-amber-400 shadow-lg shadow-amber-500/20 font-extrabold'

                        <!-- Top Row: Time Badge, Visited Toggle & Category Tag -->
                        <div class="flex flex-wrap items-center justify-between gap-2 mb-2.5">
                            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-lg bg-slate-800/90 border border-slate-700 text-amber-400 font-mono text-xs sm:text-sm font-extrabold tracking-tight">
                                <span>🕒</span>
                                <span>${escapeHTML(item.time)}</span>
                            </span>
                            <div class="flex items-center gap-2">
                                <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg border text-xs font-bold ${catStyle}">
                                    <span>${catIcon}</span>
                                    <span>${escapeHTML(item.category)}</span>
                                </span>
                            </div>
                        </div>

                        <!-- Location / Activity Title -->
                        <h3 class="text-lg sm:text-xl font-black ${isVisited ? 'line-through text-slate-400' : 'text-white'} leading-snug mb-3">
                            ${escapeHTML(item.title)}
                        </h3>

                        <!-- Detailed Transport Instructions Box -->
                        ${item.transport ? `
                            <div class="bg-sky-950/35 border border-sky-800/40 rounded-xl p-3 mb-3.5">
                                <div class="flex items-start gap-2">
                                    <span class="text-base shrink-0 mt-0.5">🚆</span>
                                    <div class="text-xs sm:text-sm text-sky-200/95 leading-relaxed font-medium">
                                        <span class="font-extrabold text-sky-400 mr-1">交通：</span>${escapeHTML(item.transport)}
                                    </div>
                                </div>
                            </div>
                        ` : ''}

                        <!-- Description & Pro-Tips -->
                        ${item.desc ? `
                            <div class="text-xs sm:text-sm text-slate-300 leading-relaxed whitespace-pre-line mb-4">
                                ${escapeHTML(item.desc)}
                            </div>
                        ` : ''}

                        <!-- Footer Action: Visited Checkbox & Direct Google Maps Button -->
                        <div class="pt-3 border-t border-slate-800/80 flex items-center justify-between gap-2">
                            <label class="inline-flex items-center gap-2 cursor-pointer select-none py-1 px-2 rounded-lg hover:bg-slate-800/70 transition">
                                <input type="checkbox" ${isVisited ? 'checked' : ''} onchange="toggleVisited(${idx})"
                                    class="w-4 h-4 rounded accent-emerald-500 cursor-pointer">
                                <span class="text-xs font-bold ${isVisited ? 'text-emerald-400' : 'text-slate-400'}">
                                    ${isVisited ? '✅ 已完成' : '標記為已完成'}
                                </span>
                            </label>
                            <a href="${mapUrl}" target="_blank" rel="noopener noreferrer"
                                class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-amber-500 text-slate-200 hover:text-slate-950 border border-slate-700 hover:border-amber-400 text-xs font-bold transition-all shadow-sm">
                                <span>📍</span>
                                <span>Google Maps 導航</span>
                                <span>↗</span>
                            </a>
                        </div>
                    </article>
                `;
            }).join('');
        }

        // Toggle Visited State
        function toggleVisited(itemIndex) {
            const dayObj = itineraryData.find(d => d.id === activeTabId);
            if (!dayObj || !dayObj.items[itemIndex]) return;
            dayObj.items[itemIndex].visited = !dayObj.items[itemIndex].visited;
            saveData(false);
            renderContent();
        }

        // Edit Mode Mutations
        function updateItemField(itemIndex, field, value) {
            const dayObj = itineraryData.find(d => d.id === activeTabId);
            if (!dayObj || !dayObj.items[itemIndex]) return;
            dayObj.items[itemIndex][field] = value;
            saveData(false);
        }

        function moveItem(itemIndex, direction) {
            const dayObj = itineraryData.find(d => d.id === activeTabId);
            if (!dayObj) return;
            const targetIndex = itemIndex + direction;
            if (targetIndex < 0 || targetIndex >= dayObj.items.length) return;

            const temp = dayObj.items[itemIndex];
            dayObj.items[itemIndex] = dayObj.items[targetIndex];
            dayObj.items[targetIndex] = temp;

            saveData(true);
            renderContent();
        }

        function deleteItem(itemIndex) {
            const dayObj = itineraryData.find(d => d.id === activeTabId);
            if (!dayObj) return;
            dayObj.items.splice(itemIndex, 1);
            saveData(true);
            renderContent();
        }

        function addNewStop() {
            const dayObj = itineraryData.find(d => d.id === activeTabId);
            if (!dayObj || dayObj.isTipsTab) return;
            dayObj.items.push({
                id: 'custom-' + Date.now(),
                time: "22:00 - 23:30",
                title: "新增景點 / 宵夜站點",
                category: "美食",
                transport: "步行約 5 分鐘即達。",
                desc: "輸入景點介紹、必食推介或注意事項...",
                mapQuery: "福岡 天神",
                visited: false
            });
            saveData(true);
            renderContent();
            setTimeout(() => {
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            }, 100);
        }

        // Reset Confirmation Modal
        function confirmReset() {
            const modal = document.getElementById('confirm-modal');
            document.getElementById('modal-title').textContent = '重設為預設行程？';
            document.getElementById('modal-desc').textContent = '確定要清除你目前所作嘅所有修改，並還原返最初設定嘅「福岡全男班 6日5夜終極行程」嗎？';
            modal.classList.remove('hidden');
            modal.classList.add('flex');

            document.getElementById('modal-cancel').onclick = () => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            };

            document.getElementById('modal-confirm').onclick = () => {
                localStorage.removeItem(STORAGE_KEY);
                itineraryData = JSON.parse(JSON.stringify(DEFAULT_ITINERARY));
                modal.classList.add('hidden');
                modal.classList.remove('flex');
                renderTabs();
                renderContent();
                showToast("🔄 已還原預設行程");
            };
        }

        // Export Self-Contained Offline HTML with Current Edits Baked In
        function exportHTML() {
            try {
                // Temporarily ensure we export in View Mode cleanly
                const currentDataJSON = JSON.stringify(itineraryData, null, 4);
                let docHtml = document.documentElement.outerHTML;

                // Replace DEFAULT_ITINERARY definition in the exported file so friends see the edited version immediately
                const startMarker = "const DEFAULT_ITINERARY = [";
                const endMarker = "// State Management";
                const startIdx = docHtml.indexOf(startMarker);
                const endIdx = docHtml.indexOf(endMarker);

                if (startIdx !== -1 && endIdx !== -1) {
                    const before = docHtml.substring(0, startIdx);
                    const after = docHtml.substring(endIdx);
                    docHtml = before + `const DEFAULT_ITINERARY = ${currentDataJSON};\n\n        ` + after;
                }

                // Reset active UI states in exported HTML string (ensure toast/modal hidden & edit mode off)
                const fullExport = "<!DOCTYPE html>\n" + docHtml;
                const blob = new Blob([fullExport], { type: 'text/html;charset=utf-8' });
                const url = URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.href = url;
                a.download = 'fukuoka_bros_trip_2026.html';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                showToast("📤 已匯出離線網頁！可直接Send畀團友");
            } catch (e) {
                console.error("Export error:", e);
                showToast("⚠️ 匯出失敗，請重試");
            }
        }

        // Security Helpers for HTML Escaping
        function escapeHTML(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function escapeAttr(str) {
            return escapeHTML(str);
        }

        // Start App
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
